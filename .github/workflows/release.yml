name: Windows installer

# On every version tag: build the NSIS installer and the portable exe, and
# attach both to the GitHub Release for that tag (created here if it does not
# exist yet, with notes generated from merged PRs).

on:
  push:
    tags:
      - "v*"
  # Rebuild and re-attach for a tag that already exists, e.g. after a failed
  # run, without moving the tag: Actions → Windows installer → Run workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --publish never: on a tag, electron-builder otherwise tries to upload
      # by itself, without a token, and fails. The step below uploads.
      - run: npm run build-exe -- --publish never
        env:
          # No code-signing certificate; do not let electron-builder go looking.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env, never pasted into the script: a typed input is text.
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --generate-notes --verify-tag
          gh release upload "$tag" release/*.exe --clobber
