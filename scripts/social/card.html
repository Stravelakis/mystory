<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Poiret One'; src: url('../../public/fonts/poiret-one-latin.woff2') format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1a0a0d; }
  .card { position: relative; width: 1200px; height: 630px;
    background: #3b0f17 url('../../brand/social.png') center -95px / 1200px auto no-repeat; }
  .shade { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(20,6,9,0) 45%, rgba(20,6,9,.9) 66%, rgba(20,6,9,.97) 100%); }
  .text { position: absolute; left: 64px; right: 64px; bottom: 44px; color: #f3e6c8; }
  h1 { font: 400 70px/1 'Poiret One', Georgia, serif; letter-spacing: .08em; margin: 0 0 12px;
    text-transform: uppercase; color: #e9cf8e; }
  p { font: 500 27px/1.3 'Segoe UI', system-ui, sans-serif; margin: 0; color: #f3e6c8; }
  .rule { width: 120px; height: 3px; background: #b8914a; margin: 0 0 14px; }
</style></head>
<body><div class="card"><div class="shade"></div>
  <div class="text">
    <h1>My Story</h1>
    <div class="rule"></div>
    <p>A private journal on your own machine. Speak Greek or English;<br>it keeps every word, puts it in order, and names what happened.</p>
  </div>
</div></body></html>
